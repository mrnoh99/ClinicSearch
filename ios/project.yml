# XcodeGen 설정 파일
# 설치:  brew install xcodegen
# 생성:  cd ios && xcodegen generate && open ClinicSearch.xcodeproj
name: ClinicSearch
options:
  bundleIdPrefix: com.clinicsearch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""           # 자신의 Apple Developer Team ID 입력
    GENERATE_INFOPLIST_FILE: NO
targets:
  ClinicSearch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClinicSearch
    info:
      path: ClinicSearch/Info.plist
      properties:
        CFBundleDisplayName: 전원병원
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocationWhenInUseUsageDescription: 가까운 전원 병원을 찾기 위해 현재 위치를 사용합니다.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"   # 1=iPhone, 2=iPad
        SUPPORTS_MACCATALYST: NO
